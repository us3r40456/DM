<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020406">
<meta name="description" content="THE NETWORK REMEMBERS.">
<title>THE NETWORK REMEMBERS.</title>
<style>
:root { color-scheme: dark; --ink:#020406; --white:#edf3f5; --ice:#b8d0d8; --cyan:#8cb6c4; }
* { box-sizing:border-box; }
html,body { width:100%; min-height:100%; margin:0; background:var(--ink); }
body { min-height:100svh; overflow:hidden; color:var(--white); font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace; }
.stage { position:relative; isolation:isolate; display:grid; place-items:center; width:100%; height:100svh; min-height:420px; overflow:hidden; background:#020406; }
/* Moving signal footage */
.signal { position:absolute; inset:-4%; z-index:-8; overflow:hidden; background:#020507; }
.signal video { display:block; width:100%; height:100%; object-fit:cover; object-position:center; filter:grayscale(.82) saturate(.2) contrast(1.42) brightness(.58); transform:scale(1.07); animation:signal-jump .92s steps(1,end) infinite, signal-tone 1.4s steps(1,end) infinite; }
/* Cold dark vignette without hiding the footage */
.veil { position:absolute; z-index:-7; inset:0; background:linear-gradient(90deg,rgba(0,0,0,.34),transparent 22%,transparent 78%,rgba(0,0,0,.38)),linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.38) 48%,rgba(0,0,0,.62)); pointer-events:none; }
.scan { position:absolute; z-index:-6; inset:-30% 0; pointer-events:none; opacity:.38; background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(201,225,233,.28) 3px,transparent 4px 6px); mix-blend-mode:screen; animation:scan 0.33s linear infinite; }
.grain { position:absolute; z-index:-5; inset:-25%; pointer-events:none; opacity:.17; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.85'/%3E%3C/svg%3E"); animation:grain .11s steps(2,end) infinite; }
.bands { position:absolute; z-index:-4; inset:0; pointer-events:none; overflow:hidden; mix-blend-mode:screen; }
.band { position:absolute; left:-12%; width:124%; height:clamp(5px,1.7vh,17px); opacity:0; background:linear-gradient(90deg,transparent,rgba(202,224,232,.75) 14%,rgba(123,158,172,.42) 44%,rgba(236,244,247,.7) 68%,transparent); box-shadow:0 0 12px rgba(190,220,230,.25); filter:blur(.45px); }
.band:nth-child(1){top:11%;animation:band-a 1.05s steps(1,end) infinite}
.band:nth-child(2){top:29%;height:4px;animation:band-b .74s steps(1,end) infinite}
.band:nth-child(3){top:53%;height:clamp(10px,2.4vh,24px);animation:band-c 1.22s steps(1,end) infinite}
.band:nth-child(4){top:76%;height:5px;animation:band-d .88s steps(1,end) infinite}
.breakup { position:absolute; z-index:-3; inset:0; pointer-events:none; opacity:0; background:linear-gradient(180deg,transparent 0 17%,rgba(220,237,242,.62) 17.3% 18.2%,transparent 18.6% 44%,rgba(139,175,189,.45) 44.2% 45%,transparent 45.5% 72%,rgba(234,242,245,.3) 72.2% 73%,transparent 73.4%); mix-blend-mode:screen; animation:breakup .68s steps(1,end) infinite; }
main { position:relative; z-index:3; width:min(94vw,1100px); padding:30px 18px; text-align:center; transform:translateY(-1vh); }
.headline { position:relative; display:inline-flex; flex-direction:column; gap:.02em; margin:0; color:#eef3f5; font-size:clamp(2.2rem,8.1vw,6.8rem); font-weight:900; line-height:.98; letter-spacing:.055em; text-align:center; text-shadow:0 0 2px #fff,0 0 12px rgba(207,231,238,.38),0 0 38px rgba(125,171,188,.16); }
.line { display:block; position:relative; white-space:nowrap; }
.line::before,.line::after { content:attr(data-text); position:absolute; inset:0; overflow:hidden; pointer-events:none; opacity:0; }
.line::before { color:#a9d6e2; text-shadow:-3px 0 rgba(175,217,230,.9); animation:text-left 1.08s steps(1,end) infinite; }
.line::after { color:#fff; text-shadow:3px 0 rgba(117,151,165,.9); animation:text-right .86s steps(1,end) infinite; }
.line:nth-child(2)::before { animation-delay:-.29s; }
.line:nth-child(2)::after { animation-delay:-.47s; }
.rule { position:relative; display:block; width:max-content; max-width:90%; margin:clamp(17px,3.4vh,30px) auto 0; color:#c4d1d6; font-size:clamp(1rem,3.7vw,1.7rem); font-weight:700; letter-spacing:.16em; text-shadow:0 0 12px rgba(201,225,233,.52); animation:rule 1.13s steps(1,end) infinite; }
/* A restrained Discord entry point. Replace the URL with an invite link to your server. */
.discord { position:fixed; z-index:5; right:max(20px,env(safe-area-inset-right)); bottom:max(18px,env(safe-area-inset-bottom)); display:inline-flex; align-items:center; gap:9px; padding:10px 13px; color:rgba(231,239,242,.74); border:1px solid rgba(202,220,226,.25); background:rgba(1,4,6,.62); text-decoration:none; font-size:10px; font-weight:700; letter-spacing:.2em; backdrop-filter:blur(7px); transition:color .2s,border-color .2s,background .2s; }
.discord:hover { color:#fff; border-color:rgba(219,238,244,.8); background:rgba(105,145,161,.18); }
.discord svg { width:15px;height:15px;fill:currentColor; }
/* Very brief blackouts and horizontal tearing create the lost-signal feel. */
@keyframes signal-jump { 0%,13%,100%{transform:scale(1.07) translate(0,0)} 14%{transform:scale(1.1) translate(-1.8%,.4%)} 15%{transform:scale(1.04) translate(1.1%,-.2%)} 16%{transform:scale(1.07) translate(0,0)} 49%{transform:scale(1.07)} 50%{transform:scale(1.12) translate(1.3%,-.5%)} 51%{transform:scale(1.05) translate(-1.2%,.3%)} 52%{transform:scale(1.07)} 83%{transform:scale(1.07)} 84%{transform:scale(1.09) translate(-.8%,.2%)} 85%{transform:scale(1.07)} }
@keyframes signal-tone { 0%,13%,16%,49%,52%,83%,100%{filter:grayscale(.82) saturate(.2) contrast(1.42) brightness(.58)} 14.4%,50.4%,84.3%{filter:grayscale(1) saturate(0) contrast(1.85) brightness(.88)} 15.2%,51.2%{filter:grayscale(1) saturate(0) contrast(1.25) brightness(.37)} }
@keyframes scan { from{transform:translateY(-18px)} to{transform:translateY(18px)} }
@keyframes grain { 0%{transform:translate(0,0)} 25%{transform:translate(-1%,1%)} 50%{transform:translate(1%,-1%)} 75%{transform:translate(-.5%,-.5%)} }
@keyframes band-a { 0%,100%{opacity:0;transform:translateX(0)} 13%{opacity:.76;transform:translateX(4%)} 14%{opacity:.18;transform:translateX(-7%)} 15%{opacity:0} 61%{opacity:0} 62%{opacity:.8;transform:translateX(-5%)} 63%{opacity:.1;transform:translateX(6%)} 64%{opacity:0} }
@keyframes band-b { 0%,100%{opacity:0} 24%{opacity:.8;transform:translateX(-8%)} 25%{opacity:.15;transform:translateX(5%)} 26%{opacity:0} 77%{opacity:0} 78%{opacity:.7;transform:translateX(7%)} 79%{opacity:0} }
@keyframes band-c { 0%,100%{opacity:0} 38%{opacity:.65;transform:translateX(6%)} 39%{opacity:.12;transform:translateX(-5%)} 40%{opacity:0} 88%{opacity:0} 89%{opacity:.85;transform:translateX(-9%)} 90%{opacity:0} }
@keyframes band-d { 0%,100%{opacity:0} 8%{opacity:.7;transform:translateX(7%)} 9%{opacity:0} 55%{opacity:0} 56%{opacity:.78;transform:translateX(-8%)} 57%{opacity:0} }
@keyframes breakup { 0%,11%,12%,33%,34%,59%,60%,100%{opacity:0;transform:translateX(0)} 11.5%{opacity:.82;transform:translateX(-1.5%)} 33.5%{opacity:.66;transform:translateX(1.2%)} 59.5%{opacity:.78;transform:translateX(-.8%)} }
@keyframes text-left { 0%,16%,20%,51%,54%,79%,82%,100%{opacity:0;clip-path:inset(0 0 100% 0);transform:translate(0)} 17%{opacity:.92;clip-path:inset(0 0 66% 0);transform:translate(-7px,-2px)} 18%{opacity:.82;clip-path:inset(34% 0 30% 0);transform:translate(5px,1px)} 19%{opacity:.9;clip-path:inset(70% 0 0 0);transform:translate(-3px,0)} 52%{opacity:.88;clip-path:inset(22% 0 54% 0);transform:translate(-6px,1px)} 53%{opacity:.82;clip-path:inset(60% 0 12% 0);transform:translate(4px,-1px)} 80%{opacity:.88;clip-path:inset(42% 0 34% 0);transform:translate(6px,0)} 81%{opacity:.75;clip-path:inset(0 0 78% 0);transform:translate(-4px,1px)} }
@keyframes text-right { 0%,28%,31%,66%,69%,92%,95%,100%{opacity:0;clip-path:inset(100% 0 0 0);transform:translate(0)} 29%{opacity:.9;clip-path:inset(12% 0 60% 0);transform:translate(7px,1px)} 30%{opacity:.8;clip-path:inset(55% 0 20% 0);transform:translate(-5px,-1px)} 67%{opacity:.92;clip-path:inset(0 0 72% 0);transform:translate(6px,-2px)} 68%{opacity:.82;clip-path:inset(48% 0 22% 0);transform:translate(-5px,1px)} 93%{opacity:.86;clip-path:inset(32% 0 42% 0);transform:translate(5px,0)} 94%{opacity:.8;clip-path:inset(75% 0 0 0);transform:translate(-4px,1px)} }
@keyframes rule { 0%,20%,22%,62%,64%,100%{opacity:.85;transform:translateX(0);filter:blur(0)} 21%{opacity:.35;transform:translateX(5px);filter:blur(1.5px)} 63%{opacity:.45;transform:translateX(-6px);filter:blur(2px)} }
@media(max-width:600px) { .headline{font-size:clamp(2rem,10vw,4.2rem);letter-spacing:.025em} .signal video{object-position:center;filter:grayscale(.9) saturate(.12) contrast(1.34) brightness(.48)} .discord{font-size:9px;padding:9px 11px} }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after{animation-duration:8s!important;animation-iteration-count:1!important;transition:none!important} }

/* Click-to-play source player */
.audio-launch{position:fixed;z-index:6;left:max(20px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));display:inline-flex;align-items:center;gap:10px;padding:11px 15px;color:rgba(235,243,246,.94);border:1px solid rgba(190,214,223,.34);border-radius:3px;background:rgba(3,8,11,.82);box-shadow:0 0 24px rgba(136,175,188,.13),inset 0 0 16px rgba(136,175,188,.05);backdrop-filter:blur(8px);cursor:pointer;text-align:left;font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;transition:border-color .18s,background .18s,transform .18s}
.audio-launch:hover{border-color:rgba(224,240,245,.72);background:rgba(20,32,38,.92);transform:translateY(-2px)}
.audio-launch:focus-visible,.audio-close:focus-visible{outline:2px solid #d7e9ee;outline-offset:4px}
.audio-launch svg{width:17px;height:17px;fill:currentColor}
.audio-modal[hidden]{display:none!important}
.audio-modal{position:fixed;z-index:50;inset:0;display:grid;place-items:center;padding:18px;background:rgba(0,3,5,.9);backdrop-filter:blur(9px);opacity:0;transition:opacity .18s ease}
.audio-modal.open{opacity:1}
.audio-panel{width:min(720px,94vw);padding:clamp(13px,2vw,22px);border:1px solid rgba(183,211,220,.3);background:linear-gradient(145deg,rgba(11,19,23,.99),rgba(2,5,7,.99));box-shadow:0 0 55px rgba(120,167,181,.14),0 18px 70px rgba(0,0,0,.75)}
.audio-panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:13px;color:#dce8ec;font:700 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em}
.audio-panel-head small{display:block;margin-top:4px;color:rgba(177,203,212,.58);font-size:8px;font-weight:500;letter-spacing:.1em}
.audio-close{border:1px solid rgba(196,218,225,.27);background:rgba(255,255,255,.04);color:#e5eef1;padding:8px 11px;cursor:pointer;font:inherit}
.audio-close:hover{background:rgba(255,255,255,.12)}
.audio-video{width:100%;aspect-ratio:16/9;background:#000}
.audio-video iframe{display:block;width:100%;height:100%;border:0}
.audio-source-note{margin:10px 0 0;color:rgba(182,204,212,.58);font:9px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.05em}
@media(max-width:600px){.audio-launch{left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));padding:9px 10px;font-size:9px}.audio-modal{padding:10px}.audio-panel-head{font-size:9px}}
@media(prefers-reduced-motion:reduce){.audio-modal{transition:none}}

</style>
</head>

}

audioClose.addEventListener('click', closeAudioModal);
audioModal.addEventListener('click', event => { if (event.target === audioModal) closeAudioModal(); });
document.addEventListener('keydown', event => { if (event.key === 'Escape' && !audioModal.hidden) closeAudioModal(); });
</script>
</body>
